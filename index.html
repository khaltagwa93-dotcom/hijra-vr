<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>هجرة الرسول ﷺ | VR</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"/><style>:root{--gold:#c9a227;--cream:#f5ecd7;--muted:#a89f8c;--panel:rgba(12,20,38,.92);--font:'Cairo',system-ui,sans-serif;--amiri:'Amiri',serif}*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font);background:#0a1628;color:var(--cream)}a-scene{position:fixed;inset:0;z-index:0}#ui{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}#ui *{pointer-events:auto}.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(180deg,rgba(8,14,28,.95),transparent);gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px}.crescent{font-size:1.8rem;color:var(--gold)}.brand h1{font-size:1.15rem;font-weight:700}.brand p{font-size:.75rem;color:var(--muted)}.top-actions{display:flex;gap:8px}.btn{font-family:var(--font);font-weight:600;font-size:.85rem;padding:8px 14px;border:1px solid rgba(201,162,39,.4);background:rgba(12,20,38,.85);color:var(--cream);border-radius:8px;cursor:pointer}.btn:hover{background:rgba(201,162,39,.2);border-color:var(--gold)}.btn:disabled{opacity:.4;cursor:not-allowed}.btn-primary{background:var(--gold);color:#1a1205;border-color:var(--gold)}.btn-vr{border-color:#4a9eff;color:#9fd0ff}.story-panel{margin:0 12px 16px;padding:16px 18px;background:var(--panel);border:1px solid rgba(201,162,39,.25);border-radius:14px;max-width:560px;align-self:center;width:calc(100% - 24px);backdrop-filter:blur(12px)}.scene-indicator{font-size:.8rem;color:var(--gold);font-weight:700;margin-bottom:6px}#scene-title{font-family:var(--amiri);font-size:1.35rem;font-weight:700;color:var(--gold);margin-bottom:8px}.narration{font-family:var(--amiri);font-size:1.05rem;line-height:1.9;margin-bottom:14px;min-height:4.5em}.nav-btns{display:flex;gap:10px}.btn-nav{flex:1}.overlay{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at center,#122038 0%,#060c18 70%);display:flex;align-items:center;justify-content:center;padding:20px}.overlay.hidden{display:none}.overlay-card{text-align:center;max-width:400px}.overlay-icon{font-size:3.5rem;margin-bottom:12px}.overlay-card h2{font-family:var(--amiri);font-size:1.8rem;color:var(--gold);margin-bottom:12px}.overlay-desc{font-size:1rem;line-height:1.8;color:var(--muted);margin-bottom:24px}.btn-start{font-size:1.1rem;padding:12px 36px;background:var(--gold);color:#1a1205;border:none;border-radius:10px;font-weight:700}.hint{margin-top:16px;font-size:.8rem;color:var(--muted)}</style></head><body><div id="ui"><header class="top-bar"><div class="brand"><span class="crescent">☪</span><div><h1>هجرة الرسول ﷺ</h1><p>نماذج شبه واقعية · قصة المكان</p></div></div><div class="top-actions"><button id="btn-voice" class="btn">🔊 تعليق</button><button id="btn-vr" class="btn btn-vr">🥽 دخول VR</button></div></header><div id="story-panel" class="story-panel"><div class="scene-indicator"><span id="scene-num">١</span> / ٥</div><h2 id="scene-title">—</h2><p id="scene-text" class="narration"></p><div class="nav-btns"><button id="btn-prev" class="btn btn-nav" disabled>→ السابق</button><button id="btn-next" class="btn btn-nav btn-primary">التالي ←</button></div></div><div id="start-overlay" class="overlay"><div class="overlay-card"><div class="overlay-icon">🕋</div><h2>هجرة رسول الله ﷺ</h2><p class="overlay-desc">مشاهد ثلاثية الأبعاد شبه واقعية<br/>من مكة إلى المدينة — بأسلوب قصة المكان</p><button id="btn-start" class="btn btn-start">ابدأ الرحلة</button><p class="hint">اسحب للنظر · WASD للحركة · نظارة VR مدعومة</p></div></div></div><a-scene id="scene" vr-mode-ui="enabled: true" renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true" background="color: #050a12" loading-screen="enabled: false" shadow="type: pcfsoft"><a-assets timeout="15000"><img id="tex-stone" crossorigin="anonymous" src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/brick_diffuse.jpg"/><img id="tex-sky-night" crossorigin="anonymous" src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/2294472375_24a3b8ef46_o.jpg"/></a-assets><a-entity id="rig" position="0 1.6 5"><a-camera look-controls wasd-controls="acceleration: 28" near="0.1" far="200"></a-camera></a-entity><a-entity light="type: ambient; color: #1a2030; intensity: 0.35"></a-entity><a-entity id="scene-1" visible="true"><a-sky src="#tex-sky-night" rotation="0 -90 0"></a-sky><a-entity id="stars-1"></a-entity><a-entity light="type: directional; color: #c8d0e0; intensity: 0.45" position="-4 12 -2"></a-entity><a-entity light="type: point; color: #ffb84d; intensity: 0.8; distance: 25" position="0 4 -4"></a-entity><a-plane position="0 0 0" rotation="-90 0 0" width="50" height="50" material="src: #tex-stone; repeat: 12 12; roughness: 0.85; color: #8a8578"></a-plane><a-entity id="kaaba" position="0 0 -8"><a-box width="3.2" height="3.6" depth="3.2" position="0 1.8 0" material="color: #0c0c0e; roughness: 0.95"></a-box><a-box width="3.35" height="0.28" depth="3.35" position="0 3.55 0" material="color: #c9a227; roughness: 0.35; metalness: 0.7; emissive: #3a2a08; emissiveIntensity: 0.15"></a-box><a-box width="0.9" height="1.6" depth="0.08" position="0 1.1 1.62" material="color: #b8860b; metalness: 0.85"></a-box><a-sphere radius="0.12" position="-1.55 1 1.55" material="color: #1a1a1a"></a-sphere><a-entity position="-2.5 2.2 2.5"><a-cylinder radius="0.04" height="0.8" material="color: #4a4030"></a-cylinder><a-sphere radius="0.1" position="0 0.5 0" material="color: #ffe0a0; emissive: #ffaa40; emissiveIntensity: 2"></a-sphere></a-entity><a-entity position="2.5 2.2 2.5"><a-cylinder radius="0.04" height="0.8" material="color: #4a4030"></a-cylinder><a-sphere radius="0.1" position="0 0.5 0" material="color: #ffe0a0; emissive: #ffaa40; emissiveIntensity: 2"></a-sphere></a-entity></a-entity><a-cone position="-14 3 -28" radius-bottom="8" radius-top="0.5" height="10" material="color: #1a2230"></a-cone><a-cone position="10 2.5 -30" radius-bottom="7" radius-top="0.3" height="9" material="color: #151d28"></a-cone></a-entity><a-entity id="scene-2" visible="false"><a-sky color="#080c12"></a-sky><a-entity light="type: ambient; color: #2a2520; intensity: 0.25"></a-entity><a-entity light="type: point; color: #6a5a40; intensity: 0.6; distance: 15" position="1 3 -3"></a-entity><a-plane position="0 0 0" rotation="-90 0 0" width="40" height="40" material="src: #tex-stone; repeat: 8 8; color: #3a3530; roughness: 0.95"></a-plane><a-cone position="0 4 -12" radius-bottom="10" radius-top="1.5" height="14" material="color: #2e2a26; roughness: 0.98"></a-cone><a-cone position="-5 2.5 -9" radius-bottom="4" radius-top="0.5" height="6" material="color: #35302c"></a-cone><a-entity position="0 1.2 -6.5"><a-cylinder radius="1.15" height="2.4" material="color: #0a0908" rotation="5 0 0"></a-cylinder></a-entity><a-entity position="0 1.8 -5.2" rotation="0 0 15"><a-ring radius-inner="0.08" radius-outer="0.35" material="color: #c8b8a0; opacity: 0.55; transparent: true; side: double"></a-ring><a-ring radius-inner="0.4" radius-outer="0.65" material="color: #b0a088; opacity: 0.4; transparent: true; side: double"></a-ring></a-entity></a-entity><a-entity id="scene-3" visible="false"><a-entity environment="preset: yavapai; skyType: atmosphere; lighting: distant; lightPosition: 5 1.2 -2; groundColor: #c2a36b; groundColor2: #8a6e3c; dressing: none; shadow: true; fog: 0.75"></a-entity><a-cone position="-8 0.3 -14" radius-bottom="7" radius-top="0" height="2.2" material="color: #c4a574"></a-cone><a-cone position="9 0.4 -16" radius-bottom="8" radius-top="0" height="2.8" material="color: #b89560"></a-cone></a-entity><a-entity id="scene-4" visible="false"><a-sky color="#0c1828"></a-sky><a-entity light="type: ambient; color: #2a3848; intensity: 0.4"></a-entity><a-entity light="type: point; color: #ffd8a0; intensity: 1.1; distance: 20" position="0 5 -4"></a-entity><a-plane position="0 0 0" rotation="-90 0 0" width="45" height="45" material="color: #2a3828"></a-plane><a-entity position="0 0 -9"><a-cylinder radius="2.4" height="2.2" position="0 1.1 0" material="color: #e8e2d6"></a-cylinder><a-sphere radius="2" position="0 2.6 0" material="color: #f0ebe0"></a-sphere><a-torus radius="0.28" radius-tubular="0.04" position="0 4.7 0" rotation="90 0 0" material="color: #c9a227; metalness: 0.8; emissive: #c9a227; emissiveIntensity: 0.3"></a-torus><a-cylinder radius="0.28" height="4.5" position="2.8 2.25 0" material="color: #e0d8cc"></a-cylinder><a-cone radius-bottom="0.42" radius-top="0" height="0.7" position="2.8 4.7 0" material="color: #c9a227"></a-cone></a-entity><a-entity position="-5 0 -5"><a-cylinder radius="0.18" height="3.2" position="0 1.6 0" material="color: #5c4030"></a-cylinder><a-sphere radius="1.1" position="0 3.5 0" material="color: #1a6b35"></a-sphere></a-entity><a-entity position="5.5 0 -6"><a-cylinder radius="0.18" height="3.2" position="0 1.6 0" material="color: #5c4030"></a-cylinder><a-sphere radius="1.1" position="0 3.5 0" material="color: #1a6b35"></a-sphere></a-entity></a-entity><a-entity id="scene-5" visible="false"><a-sky color="#081018"></a-sky><a-entity light="type: ambient; color: #1e2a38; intensity: 0.4"></a-entity><a-entity light="type: point; color: #90e0b0; intensity: 0.7; distance: 22" position="0 6 -5"></a-entity><a-plane position="0 0 0" rotation="-90 0 0" width="50" height="50" material="color: #1a2820"></a-plane><a-entity position="0 0 -10"><a-box width="8" height="2.4" depth="6" position="0 1.2 0" material="color: #e4ddd0"></a-box><a-sphere radius="2.3" position="0 3.4 0" material="color: #1a7a42; roughness: 0.35; metalness: 0.15; emissive: #0a3a20; emissiveIntensity: 0.25"></a-sphere><a-torus radius="0.32" radius-tubular="0.045" position="0 5.85 0" rotation="90 0 0" material="color: #c9a227; metalness: 0.85; emissive: #c9a227; emissiveIntensity: 0.4"></a-torus><a-cylinder radius="0.32" height="7" position="-4.2 3.5 0" material="color: #ddd5c8"></a-cylinder><a-cone radius-bottom="0.48" radius-top="0" height="0.85" position="-4.2 7.2 0" material="color: #c9a227"></a-cone><a-cylinder radius="0.32" height="7" position="4.2 3.5 0" material="color: #ddd5c8"></a-cylinder><a-cone radius-bottom="0.48" radius-top="0" height="0.85" position="4.2 7.2 0" material="color: #c9a227"></a-cone><a-box width="0.6" height="0.9" depth="0.08" position="0 1.5 3.05" material="color: #ffe8b0; emissive: #ffcc66; emissiveIntensity: 1.2"></a-box></a-entity></a-entity></a-scene><script>window.HIJRA_STORY=[{id:1,title:"مكة… حيث بدأ الأمر",text:"في مكة المكرمة، ضاقت الأرض بما رحبت على رسول الله ﷺ وأصحابه. اشتد أذى قريش، وأُذِن للمسلمين بالخروج. كانت الهجرة أمراً من الله، وبدايةً لبناء مجتمع جديد يقوم على الإيمان والعدل.",voice:"في مكة المكرمة، ضاقت الأرض بما رحبت على رسول الله صلى الله عليه وسلم وأصحابه. اشتد أذى قريش، وأذن للمسلمين بالخروج. كانت الهجرة أمراً من الله، وبداية لبناء مجتمع جديد يقوم على الإيمان والعدل."},{id:2,title:"غار ثور… ثلاثة أيام",text:"خرج النبي ﷺ وأبو بكر الصديق ليلاً، ولجآ إلى غار ثور جنوب مكة. مكثا فيه ثلاثة أيام. نسجت العنكبوت على باب الغار حتى انصرف الطلب عنهما. قال أبو بكر: لو نظر أحدهم إلى قدميه لرآنا. فقال النبي ﷺ: «ما ظنك باثنين الله ثالثهما».",voice:"خرج النبي صلى الله عليه وسلم وأبو بكر الصديق ليلاً، ولجآ إلى غار ثور. مكثا ثلاثة أيام. نسجت العنكبوت على باب الغار. قال أبو بكر: لو نظر أحدهم إلى قدميه لرآنا. فقال النبي: ما ظنك باثنين الله ثالثهما."},{id:3,title:"الطريق عبر الصحراء",text:"سلكا طريق الساحل، بعيداً عن الطريق المعتاد إلى يثرب. قطعا الصحراء في حرّ النهار وبرد الليل. ظهرت معية الله وحفظه حتى بلغا مشارف المدينة.",voice:"سلكا طريق الساحل بعيداً عن الطريق المعتاد. قطعا الصحراء في حر النهار وبرد الليل حتى بلغا مشارف المدينة."},{id:4,title:"قباء… أول مسجد",text:"نزل النبي ﷺ في قباء، وأسس مسجد قباء، أول مسجد بُني في الإسلام. فرحة الأنصار بقدومه لا توصف.",voice:"نزل النبي صلى الله عليه وسلم في قباء وأسس مسجد قباء، أول مسجد بني في الإسلام."},{id:5,title:"المدينة… دار الهجرة",text:"دخل النبي ﷺ المدينة فاستقبله أهلها. بنى المسجد النبوي، وآخى بين المهاجرين والأنصار. من هنا انطلقت دولة الإسلام وأُرّخ التاريخ الهجري. صلّى الله على محمد وآله وصحبه وسلم.",voice:"دخل النبي صلى الله عليه وسلم المدينة فاستقبله أهلها. بنى المسجد النبوي وآخى بين المهاجرين والأنصار. من هنا انطلقت دولة الإسلام. صلى الله على محمد وآله وصحبه وسلم."}];(function(){const scenes=window.HIJRA_STORY;let index=0,speaking=false;const el={title:document.getElementById("scene-title"),text:document.getElementById("scene-text"),num:document.getElementById("scene-num"),prev:document.getElementById("btn-prev"),next:document.getElementById("btn-next"),voice:document.getElementById("btn-voice"),start:document.getElementById("btn-start"),overlay:document.getElementById("start-overlay"),vr:document.getElementById("btn-vr"),scene:document.getElementById("scene")};const nums=["١","٢","٣","٤","٥"];function showScene(i){index=Math.max(0,Math.min(i,scenes.length-1));const s=scenes[index];for(let n=1;n<=5;n++){const e=document.getElementById("scene-"+n);if(e)e.setAttribute("visible",n===index+1)}el.title.textContent=s.title;el.text.textContent=s.text;el.num.textContent=nums[index];el.prev.disabled=index===0;el.next.textContent=index===scenes.length-1?"إعادة الرحلة ↺":"التالي ←";if(window.speechSynthesis){window.speechSynthesis.cancel();speaking=false;el.voice.textContent="🔊 تعليق"}}function next(){if(index>=scenes.length-1)showScene(0);else showScene(index+1)}function prev(){if(index>0)showScene(index-1)}function speak(){if(!window.speechSynthesis){alert("المتصفح لا يدعم التعليق الصوتي");return}if(speaking){window.speechSynthesis.cancel();speaking=false;el.voice.textContent="🔊 تعليق";return}const u=new SpeechSynthesisUtterance(scenes[index].voice||scenes[index].text);u.lang="ar-SA";u.rate=0.9;const ar=window.speechSynthesis.getVoices().find(v=>v.lang.startsWith("ar"));if(ar)u.voice=ar;u.onend=u.onerror=()=>{speaking=false;el.voice.textContent="🔊 تعليق"};speaking=true;el.voice.textContent="⏹ إيقاف";window.speechSynthesis.speak(u)}el.next.onclick=next;el.prev.onclick=prev;el.voice.onclick=speak;el.vr.onclick=()=>{if(el.scene&&el.scene.enterVR)el.scene.enterVR()};el.start.onclick=()=>{el.overlay.classList.add("hidden");showScene(0);if(window.speechSynthesis)window.speechSynthesis.getVoices()};document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="ArrowDown")next();if(e.key==="ArrowRight"||e.key==="ArrowUp")prev();if(e.key===" "){e.preventDefault();speak()}});const sc=document.querySelector("a-scene");function addStars(){const p=document.getElementById("stars-1");if(!p)return;for(let i=0;i<40;i++){const s=document.createElement("a-sphere");s.setAttribute("position",((Math.random()-0.5)*40)+" "+(8+Math.random()*15)+" "+(-5-Math.random()*25));s.setAttribute("radius",0.02+Math.random()*0.03);s.setAttribute("color","#fff");s.setAttribute("material","emissive:#fff;emissiveIntensity:0.8");p.appendChild(s)}}if(sc.hasLoaded)addStars();else sc.addEventListener("loaded",addStars)})();</script></body></html>
